# Fly.io configuration for the OGE website preview
# Deploys automatically from GitHub Actions on every push to main (see .github/workflows/deploy.yml).
# Static site served by nginx; the machine stops when idle and starts on the first request.

app = "oge-website"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    OGE_PREVIEW = "1"   # adds noindex + robots disallow; set to "0" for a public launch

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
