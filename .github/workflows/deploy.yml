# Optional Fly.io deployment (manual). Requires a FLY_API_TOKEN repository secret:
#   gh secret set FLY_API_TOKEN --repo utexasscott/oge-website
# then run this workflow from the Actions tab. The GitHub Pages workflow is the default host.
name: Deploy to Fly.io

on:
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the Fly app on first run
        run: flyctl apps list --json | grep -q '"Name": *"oge-website"' || flyctl apps create oge-website --org personal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
