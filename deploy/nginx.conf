server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/rss+xml application/xml;
    gzip_min_length 1024;

    # Clean URLs: /about/ -> /about/index.html ; custom 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # Long cache for static assets, short cache for pages
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Fly health check target
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
